baseURL = "https://GXEL-xy.github.io/"
defaultContentLanguage = "zh-cn"
theme = "stack"
paginate = 10

# 搜索页(search.md)自带 JSON 输出,首页无需 JSON
[outputs]
  home = ["HTML", "RSS"]

[params]
  mainSections = ["posts"]
  rssFullContent = true

  [params.sidebar]
    compact = false
    avatar = "/images/avatar.png"                # 头像图片路径(本地或 URL),留空则不显示头像

  [params.colorScheme]
    toggle = true
    default = "auto"            # auto / light / dark

  [params.widgets]
    homepage = [
      { type = "quote" },
      { type = "search" },
      { type = "categories" },
      { type = "tag-cloud" }
    ]
    page = []

  [params.footer]
    since = 2026
    customText = ""

  [params.comments]
    enabled = true
    provider = "giscus"

    [params.comments.giscus]
      repo = "GXEL-xy/GXEL-xy.github.io"
      repoID = "R_kgDOUBr4Wg"
      category = "Announcements"
      categoryID = "DIC_kwDOUBr4Ws4DEDo6"
      mapping = "pathname"          # 每篇文章按 URL 对应一个讨论帖
      lightTheme = "light"
      darkTheme = "dark_dimmed"
      reactionsEnabled = 1
      emitMetadata = 0
      inputPosition = "top"
      lang = "zh-CN"
      strict = 0
      loading = "lazy"

  [params.goatcounter]
    enabled = true                   # GoatCounter 访问统计已激活
    code = "gxel"                    # https://gxel.goatcounter.com

# ========== 中文(默认语言) ==========
[languages.zh-cn]
  locale = "zh-cn"
  languageName = "简体中文"
  title = "GXEL的个人网站"
  weight = 1
  contentDir = "content"

  [languages.zh-cn.params.sidebar]
    subtitle = "记录技术探索与思考"

  [languages.zh-cn.menu]
    [[languages.zh-cn.menu.main]]
      identifier = "home"
      name = "首页"
      url = "/"
      weight = 1
    [[languages.zh-cn.menu.main]]
      identifier = "posts"
      name = "文章"
      url = "/posts/"
      weight = 2
    [[languages.zh-cn.menu.main]]
      identifier = "about"
      name = "关于"
      url = "/about/"
      weight = 3
    [[languages.zh-cn.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 4

# ========== 英文 ==========
[languages.en]
  locale = "en"
  languageName = "English"
  title = "GXEL's Website"
  weight = 2
  contentDir = "content-en"

  [languages.en.params.sidebar]
    subtitle = "Documenting tech exploration & thinking"

  [languages.en.menu]
    [[languages.en.menu.main]]
      identifier = "home"
      name = "Home"
      url = "/"
      weight = 1
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 2
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 3
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 4
