baseURL = "https://GXEL-xy.github.io/"
locale = "zh-cn"
title = "GXEL的个人网站"
theme = "stack"
paginate = 10

# 搜索页(search.md)自带 JSON 输出,首页无需 JSON
[outputs]
  home = ["HTML", "RSS"]

[params]
  mainSections = ["posts"]
  rssFullContent = true

  [params.sidebar]
    compact = false
    avatar = "/images/avatar.png"                # 头像图片路径(本地或 URL),留空则不显示头像
    subtitle = "记录技术探索与思考"

  [params.colorScheme]
    toggle = true
    default = "auto"            # auto / light / dark

  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "categories" },
      { type = "tag-cloud" }
    ]
    page = []

  [params.footer]
    since = 2026
    customText = ""

  [params.comments]
    enabled = false

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 3
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 4
